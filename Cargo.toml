[package]
name = "rafale-viewer"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = "1.25.2"
crossbeam-channel = "0.5.17"
env_logger = "0.11.11"
kamadak-exif = "0.6.1"
log = "0.4.34"
lru = "0.19.0"
pollster = "1.0.1"
turbojpeg = "1.5.1"
wgpu = "30.0.1"
winit = "0.30.13"

# Les dépendances (décodeur JPEG notamment) restent optimisées en mode debug.
[profile.dev.package."*"]
opt-level = 3
